name: Rebuild café data

# Every Monday at 03:00 UTC, plus a "Run workflow" button for when you've just edited OSM.
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-data
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Exits non-zero, and leaves the old file alone, if the parser test fails,
      # Overpass is unreachable, or the result is suspiciously small.
      - name: Build data/cafes.json from OpenStreetMap
        run: python tools/build_data.py

      - name: Commit and push if anything changed
        run: |
          if git diff --quiet -- data/cafes.json; then
            echo "No changes."
            exit 0
          fi
          summary=$(python -c "import json; p=json.load(open('data/cafes.json',encoding='utf-8'))['places']; print(f'{len(p)} places, {sum(x[\"specialty\"] for x in p)} specialty')")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cafes.json
          git commit -m "Data: weekly OSM rebuild ($summary)"
          git push
